name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ls -la
          test -f project.zip
          unzip -o project.zip -d project
          ls -la project
      - name: Patch sources
        run: |
          f=$(find project -name MainActivity.java | head -1)
          echo "Patching $f"
          for imp in android.webkit.ValueCallback android.webkit.WebChromeClient android.webkit.WebChromeClient.FileChooserParams; do
            grep -q "import $imp;" "$f" || sed -i "s|import android.webkit.WebViewClient;|import $imp;\nimport android.webkit.WebViewClient;|" "$f"
          done
          sed -i '/setOnRefreshListener/c\        swipe.setOnRefreshListener(new SwipeRefreshLayout.OnRefreshListener(){ public void onRefresh(){ web.reload(); } });' "$f"
      - name: Patch kotlin stdlib conflict
        run: |
          f=project/app/build.gradle
          printf '\nconfigurations.all {\n    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\n}\n' >> "$f"
          tail -6 "$f"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -x
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          cd $SDK/cmdline-tools
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore
        run: |
          if [ -f keystore.jks ]; then
            cp keystore.jks project/keystore.jks
            echo "Using keystore from repo root"
          else
            keytool -genkeypair -keystore project/keystore.jks -alias app -keyalg RSA -keysize 2048 -validity 10000 -storepass 'ZqwtafwCrrhY' -keypass '7fFTmhR4xsRx' -dname 'CN=V Siluet, O=Web2APK, C=RU'
            echo "NEW keystore generated - SAVE IT for updates"
          fi
          printf 'alias: app\nstorepass: ZqwtafwCrrhY\nkeypass: 7fFTmhR4xsRx\nKEEP keystore.jks SAFE. Upload it to repo root so updates use the same key.\n' > KEYSTORE-INFO.txt
      - name: Build release APK
        run: cd project && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          if-no-files-found: error
          path: |
            project/app/build/outputs/apk/release/app-release.apk
            project/keystore.jks
            KEYSTORE-INFO.txt
