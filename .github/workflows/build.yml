name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project
        run: |
          mkdir -p project/app/src/main/java/ru/dmitrybigshon/vsiluet project/app/src/main/res/values project/app/src/main/res/layout project/app/src/main/res/mipmap-anydpi-v26 project/app/src/main/res/drawable project/app/src/main/assets
          cat > project/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'WebApp'
          include ':app'
          EOF
          cat > project/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > project/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ru.dmitrybigshon.vsiluet'
              compileSdk 34
              defaultConfig {
                  applicationId "ru.dmitrybigshon.vsiluet"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file('../keystore.jks')
                      storePassword 'ZqwtafwCrrhY'
                      keyAlias 'app'
                      keyPassword '7fFTmhR4xsRx'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.core:core-splashscreen:1.0.1'
          }
          EOF
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/SplashTheme"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.swiperefreshlayout.widget.SwipeRefreshLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/swipe"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/web"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
          </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          EOF
          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">V-Силуэт</string>
          </resources>
          EOF
          cat > project/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="status">#0B1020</color>
              <color name="splash">#0B1020</color>
              <color name="ic_bg">#0B1020</color>
          </resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@color/status</item>
                  <item name="android:navigationBarColor">@color/status</item>
                  <item name="android:windowBackground">@color/splash</item>
              </style>
              <style name="SplashTheme" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">@color/splash</item>
                  <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="postSplashScreenTheme">@style/AppTheme</item>
              </style>
          </resources>
          EOF
          cat > project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fore"/>
          </adaptive-icon>
          EOF
          cat > project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fore"/>
          </adaptive-icon>
          EOF
          cat > project/app/src/main/res/drawable/ic_fore.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M34,40 L54,76 L74,40"
                  android:strokeColor="#FF7A29" android:strokeWidth="9"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
              <path android:pathData="M32,30 L76,30"
                  android:strokeColor="#38C8FF" android:strokeWidth="7"
                  android:strokeLineCap="round"/>
          </vector>
          EOF
          cat > project/app/src/main/assets/config.json <<'EOF'
          {"url":"https://dmitrybigshon.neocities.org","name":"V-Силуэт","statusBar":"#0B1020","pull":true,"extBrowser":true,"offline":true,"files":true,"zoom":false,"geo":false,"camera":false,"fullscreen":false,"ua":"default"}
          EOF
          cat > project/app/src/main/assets/offline.html <<'EOF'
          <!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Нет сети</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1020;color:#EAF0FB;font:16px/1.6 system-ui,sans-serif;text-align:center}.b{padding:30px}.i{font-size:52px}h1{font-size:21px;margin:14px 0 6px}p{color:#9AA7C2;font-size:14px;margin:0 0 20px}a{display:inline-block;background:linear-gradient(100deg,#FF7A29,#FF3D8A);color:#170609;font-weight:800;text-decoration:none;padding:13px 26px;border-radius:13px}</style></head><body><div class="b"><div class="i">📡</div><h1>Нет подключения</h1><p>Проверь интернет и попробуй ещё раз.</p><a href="%URL%">Повторить</a></div></body></html>
          EOF
          cat > project/app/src/main/java/ru/dmitrybigshon/vsiluet/MainActivity.java <<'EOF'
          package ru.dmitrybigshon.vsiluet;
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import org.json.JSONObject;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          public class MainActivity extends AppCompatActivity {
              private WebView web; private SwipeRefreshLayout swipe; private JSONObject cfg = new JSONObject();
              private ValueCallback<Uri[]> fileCb; private PermissionRequest webPerm;
              private String geoOrigin; private GeolocationPermissions.Callback geoCb;
              private static final int RC_FILE = 101, RC_PERM = 102;
              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle s) {
                  SplashScreen.installSplashScreen(this);
                  super.onCreate(s);
                  setContentView(R.layout.activity_main);
                  try { InputStream in = getAssets().open("config.json"); byte[] b = new byte[in.available()]; in.read(b); in.close(); cfg = new JSONObject(new String(b, StandardCharsets.UTF_8)); } catch (Exception ignored) {}
                  final String url = cfg.optString("url", "https://example.com");
                  getWindow().setStatusBarColor(parse(cfg.optString("statusBar", "#0B1020")));
                  getWindow().setNavigationBarColor(parse(cfg.optString("statusBar", "#0B1020")));
                  if (cfg.optBoolean("fullscreen", false)) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  swipe = findViewById(R.id.swipe); web = findViewById(R.id.web);
                  WebSettings st = web.getSettings();
                  st.setJavaScriptEnabled(true); st.setDomStorageEnabled(true); st.setDatabaseEnabled(true);
                  st.setMediaPlaybackRequiresUserGesture(false); st.setUseWideViewPort(true); st.setLoadWithOverviewMode(true);
                  st.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  boolean zoom = cfg.optBoolean("zoom", false);
                  st.setSupportZoom(zoom); st.setBuiltInZoomControls(zoom); st.setDisplayZoomControls(false);
                  String ua = cfg.optString("ua", "default");
                  if (ua.equals("desktop")) st.setUserAgentString("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36");
                  else if (!ua.equals("default") && !ua.isEmpty()) st.setUserAgentString(ua);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                  swipe.setEnabled(cfg.optBoolean("pull", true));
                  swipe.setOnRefreshListener(new SwipeRefreshLayout.OnRefreshListener() { public void onRefresh() { web.reload(); } });
                  web.setWebViewClient(new WebViewClient() {
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl(); String sc = u.getScheme() == null ? "" : u.getScheme();
                          if (sc.equals("http") || sc.equals("https")) {
                              if (allowed(u)) return false;
                              if (cfg.optBoolean("extBrowser", true)) { open(u); return true; }
                              return false;
                          }
                          open(u); return true;
                      }
                      public void onPageFinished(WebView v, String u) { swipe.setRefreshing(false); }
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame() && cfg.optBoolean("offline", true)) v.loadDataWithBaseURL(cfg.optString("url", ""), offlineHtml(), "text/html", "utf-8", null);
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      public void onPermissionRequest(final PermissionRequest r) {
                          if (!cfg.optBoolean("camera", false)) { r.deny(); return; }
                          List<String> need = new ArrayList<>();
                          for (String res : r.getResources()) {
                              if (res.equals(PermissionRequest.RESOURCE_VIDEO_CAPTURE) && !has(Manifest.permission.CAMERA)) need.add(Manifest.permission.CAMERA);
                              if (res.equals(PermissionRequest.RESOURCE_AUDIO_CAPTURE) && !has(Manifest.permission.RECORD_AUDIO)) need.add(Manifest.permission.RECORD_AUDIO);
                          }
                          webPerm = r;
                          if (need.isEmpty()) r.grant(r.getResources()); else ActivityCompat.requestPermissions(MainActivity.this, need.toArray(new String[0]), RC_PERM);
                      }
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (!cfg.optBoolean("geo", false)) { cb.invoke(origin, false, false); return; }
                          geoOrigin = origin; geoCb = cb;
                          if (has(Manifest.permission.ACCESS_FINE_LOCATION)) cb.invoke(origin, true, false);
                          else ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, RC_PERM);
                      }
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (!cfg.optBoolean("files", true)) return false;
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(p.createIntent(), RC_FILE); } catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });
                  if (cfg.optBoolean("files", true)) web.setDownloadListener(new android.webkit.DownloadListener() {
                      public void onDownloadStart(String u, String a, String cd, String mime, long len) {
                          try {
                              DownloadManager.Request q = new DownloadManager.Request(Uri.parse(u));
                              q.setMimeType(mime);
                              String ck = CookieManager.getInstance().getCookie(u);
                              if (ck != null) q.addRequestHeader("Cookie", ck);
                              q.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              String fn = URLUtil.guessFileName(u, cd, mime);
                              q.setTitle(fn);
                              q.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fn);
                              ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(q);
                              Toast.makeText(MainActivity.this, "Скачивание началось", Toast.LENGTH_SHORT).show();
                          } catch (Exception ex) { open(Uri.parse(u)); }
                      }
                  });
                  if (s != null) web.restoreState(s); else web.loadUrl(url);
              }
              private boolean allowed(Uri u) {
                  String host = u.getHost() == null ? "" : u.getHost();
                  try {
                      String base = Uri.parse(cfg.optString("url", "")).getHost();
                      if (base != null && (host.equals(base) || host.endsWith("." + base))) return true;
                  } catch (Exception ignored) {}
                  return false;
              }
              private void open(Uri u) { try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { Toast.makeText(this, "Нет приложения для ссылки", Toast.LENGTH_SHORT).show(); } }
              private boolean has(String p) { return ContextCompat.checkSelfPermission(this, p) == PackageManager.PERMISSION_GRANTED; }
              private int parse(String c) { try { return Color.parseColor(c); } catch (Exception e) { return Color.parseColor("#0B1020"); } }
              private String offlineHtml() {
                  try { InputStream in = getAssets().open("offline.html"); byte[] b = new byte[in.available()]; in.read(b); in.close(); return new String(b, StandardCharsets.UTF_8).replace("%URL%", cfg.optString("url", "")); }
                  catch (Exception e) { return "<h3>Нет сети</h3>"; }
              }
              public void onRequestPermissionsResult(int rc, String[] p, int[] g) {
                  super.onRequestPermissionsResult(rc, p, g);
                  boolean ok = g.length > 0; for (int x : g) if (x != PackageManager.PERMISSION_GRANTED) ok = false;
                  if (webPerm != null) { if (ok) webPerm.grant(webPerm.getResources()); else webPerm.deny(); webPerm = null; }
                  if (geoCb != null) { geoCb.invoke(geoOrigin, ok, false); geoCb = null; }
              }
              protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (rc == RC_FILE && fileCb != null) {
                      Uri[] out = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) { int n = data.getClipData().getItemCount(); out = new Uri[n]; for (int i = 0; i < n; i++) out[i] = data.getClipData().getItemAt(i).getUri(); }
                          else if (data.getData() != null) out = new Uri[]{data.getData()};
                      }
                      fileCb.onReceiveValue(out); fileCb = null;
                  }
              }
              public void onBackPressed() { if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }
              protected void onSaveInstanceState(Bundle b) { super.onSaveInstanceState(b); if (web != null) web.saveState(b); }
              protected void onDestroy() { if (web != null) web.destroy(); super.onDestroy(); }
          }
          EOF
          ls -R project | head -40
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -x
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          cd $SDK/cmdline-tools
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore
        run: |
          if [ -f keystore.jks ]; then
            cp keystore.jks project/keystore.jks
            echo "Using keystore from repo root"
          else
            keytool -genkeypair -keystore project/keystore.jks -alias app -keyalg RSA -keysize 2048 -validity 10000 -storepass 'ZqwtafwCrrhY' -keypass '7fFTmhR4xsRx' -dname 'CN=V Siluet, O=Web2APK, C=RU'
            echo "NEW keystore generated - SAVE IT for updates"
          fi
          printf 'alias: app\nstorepass: ZqwtafwCrrhY\nkeypass: 7fFTmhR4xsRx\nKEEP keystore.jks SAFE. Upload it to repo root so updates use the same key.\n' > KEYSTORE-INFO.txt
      - name: Build release APK
        run: cd project && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          if-no-files-found: error
          path: |
            project/app/build/outputs/apk/release/app-release.apk
            project/keystore.jks
            KEYSTORE-INFO.txt
