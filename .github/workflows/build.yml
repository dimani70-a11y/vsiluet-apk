name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ls -la
          test -f project.zip
          unzip -o project.zip -d project
          ls -la project
      - name: Rewrite MainActivity
        run: |
          F=$(find project -name MainActivity.java | head -1)
          PL=$(head -1 "$F")
          echo "Original package line: $PL"
          cat > "$F" <<'JAVAEOF'
          package PLACEHOLDER;

          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          import org.json.JSONObject;

          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends AppCompatActivity {
              private WebView web;
              private SwipeRefreshLayout swipe;
              private JSONObject cfg = new JSONObject();
              private ValueCallback<Uri[]> fileCb;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  SplashScreen.installSplashScreen(this);
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  try {
                      InputStream in = getAssets().open("config.json");
                      byte[] buf = new byte[in.available()];
                      in.read(buf);
                      in.close();
                      cfg = new JSONObject(new String(buf, StandardCharsets.UTF_8));
                  } catch (Exception ignored) { }
                  final String url = cfg.optString("url", "https://example.com");
                  int bar;
                  try { bar = Color.parseColor(cfg.optString("statusBar", "#0B1020")); }
                  catch (Exception e) { bar = Color.parseColor("#0B1020"); }
                  getWindow().setStatusBarColor(bar);
                  getWindow().setNavigationBarColor(bar);
                  swipe = findViewById(R.id.swipe);
                  web = findViewById(R.id.web);
                  WebSettings st = web.getSettings();
                  st.setJavaScriptEnabled(true);
                  st.setDomStorageEnabled(true);
                  st.setUseWideViewPort(true);
                  st.setLoadWithOverviewMode(true);
                  boolean zoom = cfg.optBoolean("zoom", false);
                  st.setSupportZoom(zoom);
                  st.setBuiltInZoomControls(zoom);
                  st.setDisplayZoomControls(false);
                  st.setMediaPlaybackRequiresUserGesture(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                  swipe.setEnabled(cfg.optBoolean("pull", true));
                  swipe.setOnRefreshListener(new SwipeRefreshLayout.OnRefreshListener() {
                      @Override
                      public void onRefresh() { web.reload(); }
                  });
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          String s = u.getScheme() == null ? "" : u.getScheme();
                          if (s.equals("http") || s.equals("https")) {
                              if (allowed(u)) return false;
                              if (!cfg.optBoolean("extBrowser", true)) return false;
                          }
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); }
                          catch (Exception e) { Toast.makeText(MainActivity.this, "Нет приложения", Toast.LENGTH_SHORT).show(); }
                          return true;
                      }
                      @Override
                      public void onPageFinished(WebView view, String u) { swipe.setRefreshing(false); }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req.isForMainFrame() && cfg.optBoolean("offline", true)) {
                              view.loadDataWithBaseURL(url, offlineHtml(), "text/html", "utf-8", null);
                          }
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, WebChromeClient.FileChooserParams params) {
                          if (!cfg.optBoolean("files", true)) return false;
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(params.createIntent(), 101); }
                          catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });
                  web.setDownloadListener(new android.webkit.DownloadListener() {
                      @Override
                      public void onDownloadStart(String u, String ua, String cd, String mime, long len) {
                          try {
                              String name = URLUtil.guessFileName(u, cd, mime);
                              DownloadManager.Request r = new DownloadManager.Request(Uri.parse(u));
                              r.setMimeType(mime);
                              r.setTitle(name);
                              r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                              DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                              dm.enqueue(r);
                              Toast.makeText(MainActivity.this, "Скачивание началось", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) { }
                      }
                  });
                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(url);
              }

              private boolean allowed(Uri u) {
                  String host = u.getHost() == null ? "" : u.getHost();
                  try {
                      String base = Uri.parse(cfg.optString("url", "")).getHost();
                      if (base != null && (host.equals(base) || host.endsWith("." + base))) return true;
                      org.json.JSONArray arr = cfg.optJSONArray("hosts");
                      if (arr != null) {
                          for (int i = 0; i < arr.length(); i++) {
                              String h = arr.optString(i, "").trim();
                              if (!h.isEmpty() && (host.equals(h) || host.endsWith("." + h))) return true;
                          }
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              private String offlineHtml() {
                  try {
                      InputStream in = getAssets().open("offline.html");
                      byte[] buf = new byte[in.available()];
                      in.read(buf);
                      in.close();
                      return new String(buf, StandardCharsets.UTF_8).replace("%URL%", cfg.optString("url", ""));
                  } catch (Exception e) {
                      return "<h3>Нет сети</h3>";
                  }
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (rc == 101 && fileCb != null) {
                      Uri[] out = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              out = new Uri[n];
                              for (int i = 0; i < n; i++) out[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) {
                              out = new Uri[]{data.getData()};
                          }
                      }
                      fileCb.onReceiveValue(out);
                      fileCb = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (web != null) web.saveState(out);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          JAVAEOF
          sed -i "1s|.*|$PL|" "$F"
          head -3 "$F"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -x
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          cd $SDK/cmdline-tools
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore
        run: |
          if [ -f keystore.jks ]; then
            cp keystore.jks project/keystore.jks
            echo "Using keystore from repo root"
          else
            keytool -genkeypair -keystore project/keystore.jks -alias app -keyalg RSA -keysize 2048 -validity 10000 -storepass 'ZqwtafwCrrhY' -keypass '7fFTmhR4xsRx' -dname 'CN=V Siluet, O=Web2APK, C=RU'
            echo "NEW keystore generated - SAVE IT for updates"
          fi
          printf 'alias: app\nstorepass: ZqwtafwCrrhY\nkeypass: 7fFTmhR4xsRx\nKEEP keystore.jks SAFE. Upload it to repo root so updates use the same key.\n' > KEYSTORE-INFO.txt
      - name: Build release APK
        run: cd project && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          if-no-files-found: error
          path: |
            project/app/build/outputs/apk/release/app-release.apk
            project/keystore.jks
            KEYSTORE-INFO.txt
